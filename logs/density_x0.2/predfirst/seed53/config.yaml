ckpt_base_path: /home/soni/alra/checkpoints/mediummaze_dynamics_shift
model_name: mediummaze_dynamics_shift
model_epoch: latest
seed: 53
n_evals: 100
goal_source: hard
eval_data_path: /home/soni/alra/data/point_maze_medium
eval_use_frame_files: false
env_kwargs_override:
  density_scale: 0.2
goal_H: 50
n_plot_samples: 10
decode_for_viz: false
num_start_frames: 1
debug_dset_init: false
objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 0
  base: 2
  mode: all
